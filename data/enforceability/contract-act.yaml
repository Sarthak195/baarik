# Enforceability rows under the Indian Contract Act, 1872.
#
# Each row states what the section provides and what courts have held, never what
# the reader should do about their own contract. Advocates Act 1961 ss.29 and 33,
# read with BCI v A.K. Balaji (2018), reserve advice on a person's own matter to
# enrolled advocates, so `plainMeaning` describes the law and `caveats` carry what
# the row does not decide.
version: '2026.09.13'

rules:
  - construct: post_employment_non_compete
    verdict: likely_void
    confidence: high
    statute:
      act: 'Indian Contract Act, 1872'
      section: 'Section 27 — Agreement in restraint of trade, void'
      text: 'Every agreement by which any one is restrained from exercising a lawful profession, trade or business of any kind, is to that extent void.'
      url: 'https://www.indiacode.nic.in/show-data?actid=AC_CEN_3_20_00035_187209_1523268996428&sectionId=38631&sectionno=27&orderno=28'
    authorities:
      - cite: 'Niranjan Shankar Golikari v The Century Spinning and Mfg Co Ltd, AIR 1967 SC 1098 (17 January 1967)'
        holding: 'A restraint that operates while the employment is still running was upheld; the Supreme Court treated restrictions that bite after the employment ends as standing on a different footing under section 27.'
        url: 'https://indiankanoon.org/doc/452434/'
      - cite: 'Varun Tyagi v Daffodil Software Private Limited, FAO 167/2025, Delhi High Court (25 June 2025)'
        holding: 'A clause barring the employee from working with a business associate of the employer after the employment ended was held void under section 27; confidentiality and trade-secret protection was treated as the legitimate route instead.'
        url: 'https://indiankanoon.org/doc/187332526/'
    plainMeaning: 'Indian law generally does not enforce a promise not to work for a competitor after your job ends. India has no test of reasonableness that saves such a promise, unlike England or the United States. The confidentiality promise sitting next to it is a separate thing and usually does still hold.'
    caveats:
      - 'This describes what the section says and how courts have read it. It is not an opinion about your contract or your situation.'
      - 'A restraint that applies while you are still employed is treated differently and is often enforced.'
      - 'Protection of trade secrets, client data and confidential information can bind you after you leave, even when the non-compete does not.'
      - 'The other side can still sue. Only a court can decide what this clause does on your facts, and defending a suit costs time and money.'
      - 'Garden leave, notice buy-outs and non-solicitation clauses raise separate questions this row does not cover.'
    appliesTo: [employment_offer, nda, freelance_contract]

  - construct: contractual_limitation_period
    verdict: likely_void
    confidence: high
    statute:
      act: 'Indian Contract Act, 1872'
      section: 'Section 28(b), read with section 28(a) — Agreements in restraint of legal proceedings, void'
      text: 'Every agreement, (a) by which any party thereto is restricted absolutely from enforcing his rights under or in respect of any contract, by the usual legal proceedings in the ordinary tribunals, or which limits the time within which he may thus enforce his rights; or (b) which extinguishes the rights of any party thereto, or discharges any party thereto from any liability, under or in respect of any contract on the expiry of a specified period so as to restrict any party from enforcing his rights, is void to that extent.'
      url: 'https://www.indiacode.nic.in/show-data?actid=AC_CEN_3_20_00035_187209_1523268996428&sectionId=38632&sectionno=28&orderno=29'
    authorities: []
    plainMeaning: 'A clause that gives you only thirty or ninety days to raise a claim, or that says your rights disappear after a short period, does not usually take away the time the general law of limitation gives you.'
    caveats:
      - 'This describes the section, not your contract. Whether a particular clause falls inside it is for a court to decide.'
      - 'Clause (b) was added by the 1997 amendment; decisions from before 1997 that upheld clauses extinguishing rights on expiry pre-date that change.'
      - 'The section does not extend the time the Limitation Act gives you. That clock runs from when your cause of action arose, whatever the contract says.'
      - 'Arbitration clauses that set a period for commencing arbitration are treated separately and are not all caught by this section.'
    appliesTo: []

  - construct: forfeiture_of_paid_amounts
    verdict: capped_by_statute
    confidence: high
    statute:
      act: 'Indian Contract Act, 1872'
      section: 'Section 74 — Compensation for breach of contract where penalty stipulated for'
      text: 'When a contract has been broken, if a sum is named in the contract as the amount to be paid in case of such breach, or if the contract contains any other stipulation by way of penalty, the party complaining of the breach is entitled, whether or not actual damage or loss is proved to have been caused thereby, to receive from the party who has broken the contract reasonable compensation not exceeding the amount so named or, as the case may be, the penalty stipulated for.'
      url: 'https://www.indiacode.nic.in/show-data?actid=AC_CEN_3_20_00035_187209_1523268996428&orderno=75'
    authorities:
      - cite: 'Kailash Nath Associates v Delhi Development Authority, (2015) 4 SCC 136 (9 January 2015)'
        holding: 'Section 74 awards reasonable compensation for loss caused by the breach; damage or loss is a sine qua non, and where no loss is shown, the named sum is not recoverable merely because it was named.'
        url: 'https://indiankanoon.org/doc/70828540/'
      - cite: 'Vijaya Bank v Prashant B Narnaware, 2025 INSC 691 (14 May 2025)'
        holding: "A minimum-service clause requiring Rs 2,00,000 on premature resignation was upheld: it was treated as a genuine pre-estimate of the employer's recruitment and training cost rather than a penalty, and as not being a restraint of trade."
        url: 'https://indiankanoon.org/doc/42763766/'
    plainMeaning: 'A sum named in the contract sets the ceiling, not the amount. The other side can recover what it can show it actually lost, up to that figure, and a court decides what is reasonable.'
    caveats:
      - 'This states the rule in the section. What the other side can actually recover from you depends on evidence a court has not yet seen.'
      - 'Where the named sum is a genuine pre-estimate of a real cost and is reasonable, courts have allowed the whole of it, as in Vijaya Bank (2025).'
      - 'Forfeiture of earnest money in property transactions has its own line of cases and is not decided by this row.'
      - 'Getting money back that has already been paid usually means going to a forum and proving the loss was less than the sum kept.'
    appliesTo: []

  - construct: sole_discretion_on_payment
    verdict: context_dependent
    confidence: medium
    statute:
      act: 'Indian Contract Act, 1872'
      section: 'Section 23 — What considerations and objects are lawful, and what not'
      text: 'The consideration or object of an agreement is lawful, unless it is forbidden by law; or is of such a nature that, if permitted, it would defeat the provisions of any law; or is fraudulent; or involves or implies injury to the person or property of another; or the Court regards it as immoral, or opposed to public policy. In each of these cases, the consideration or object of an agreement is said to be unlawful. Every agreement of which the object or consideration is unlawful is void.'
      url: 'https://indiacode.nic.in/show-data?actid=AC_CEN_3_20_00035_187209_1523268996428&orderno=24&sectionId=38627&sectionno=23'
    authorities:
      - cite: 'Central Inland Water Transport Corporation Ltd v Brojo Nath Ganguly, (1986) 3 SCC 156 (6 April 1986)'
        holding: 'A term in a printed standard-form contract between parties of unequal bargaining power, which is unfair, unreasonable and unconscionable, was held void under section 23 as opposed to public policy.'
        url: 'https://indiankanoon.org/doc/477313/'
    plainMeaning: 'Courts have struck down terms in standard printed contracts where one side had no real chance to negotiate and the term was grossly one-sided. Whether a particular term is of that kind depends on the bargaining position of the two sides.'
    caveats:
      - 'This is the general principle, not a ruling on your clause. Only a court applying it to your facts can say whether the term stands.'
      - 'Brojo Nath concerned an instrumentality of the State; later decisions have been cautious about extending it to contracts between commercial parties of comparable strength.'
      - 'Showing unequal bargaining power is part of the case and has to be proved, not assumed.'
      - 'A consumer complaint about an unfair contract term may be a quicker route than a civil suit; the routes are separate.'
    appliesTo: [employment_offer, freelance_contract, other]
